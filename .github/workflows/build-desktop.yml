name: Build Vault Zero desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: '--bundles nsis,msi'
          - os: macos-latest
            platform: macos
            args: '--bundles app,dmg'
          - os: ubuntu-22.04
            platform: linux
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@v2
      - name: Build bundles
        run: cargo tauri build ${{ matrix.args }}
      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: vault-zero-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename installers to stable download names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -iname '*.exe' -exec cp {} dist/Vault.Zero.Windows.exe \;
          find artifacts -type f -iname '*.msi' -exec cp {} dist/Vault.Zero.Windows.msi \;
          find artifacts -type f -iname '*.dmg' -exec cp {} dist/Vault.Zero.macOS.dmg \;
          find artifacts -type f -iname '*.AppImage' -exec cp {} dist/Vault.Zero.Linux.AppImage \;
          find artifacts -type f -iname '*.deb' -exec cp {} dist/Vault.Zero.Linux.deb \;
          test -f dist/Vault.Zero.Windows.exe
          test -f dist/Vault.Zero.macOS.dmg
          test -f dist/Vault.Zero.Linux.AppImage
          test -f dist/Vault.Zero.Linux.deb
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: vault-zero-v0.1.0
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Vault Zero v0.1.0" --notes "Desktop installers for Windows, macOS and Linux." --prerelease
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
