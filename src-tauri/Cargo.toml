[package]
name = "vault-zero"
version = "0.1.0"
description = "Zero-trust data and password vault"
authors = ["Vault Zero"]
edition = "2021"

[lib]
name = "vault_zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
